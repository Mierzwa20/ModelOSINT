services:
  # Python flask app
  python-app:
    build: .
    ports:
      - "5555:5555"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-app:5432/db-app?sslmode=disable
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    depends_on:
      - db-migrator
    command: ["python", "app.py"]

  # Postgres database
  db-app:
    image: postgres:16.14-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db-app
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d db-app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database migration tool
  db-migrator:
    image: amacneil/dbmate:2.33
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-app:5432/db-app?sslmode=disable"
      DBMATE_MIGRATIONS_DIR: "/db-migrations"
    volumes:
      - ./db-migrations:/db-migrations
    depends_on:
      db-app:
        condition: service_healthy
    command: ["up"]

volumes:
  db_data:
