{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        
        <div class="progress mt-5" style="height: 10px;">
            <div class="progress-bar bg-primary" role="progressbar" style="width: {{ progress }};"></div>
        </div>
        
        <div class="card p-4 mt-3">
            <h3 class="border-bottom pb-3 mb-4 text-primary">{{ category }}</h3>
            
            <form method="POST">
                {% for q in questions %}
                <div class="mb-4 p-3 bg-light rounded border">
                    <label class="form-label fw-bold">{{ loop.index }}. {{ q.question }}</label>
                    <div class="mt-2">
                        {% for opt_text, opt_points in q.options %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio" 
                                   name="q_{{ q.id }}" 
                                   id="q_{{ q.id }}_{{ loop.index0 }}" 
                                   value="{{ loop.index0 }}" 
                                   required>
                            <label class="form-check-label" for="q_{{ q.id }}_{{ loop.index0 }}">
                                {{ opt_text }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-primary">Następna sekcja &raquo;</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
